# Plan on PR — the review gate's evidence. The OIDC role (gha-aws-iac-plan,
# live/iam-github-oidc.tf) is ReadOnlyAccess; -lock=false keeps the plan from
# needing a single write permission. The plan lands as a sticky PR comment; a
# plan containing destroys gets a loud warning here, and the apply workflow
# will refuse it outright.

name: plan

on:
  pull_request:
    branches: [master]

permissions:
  id-token: write # OIDC exchange
  contents: read
  pull-requests: write # sticky plan comment

concurrency:
  group: tofu-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gha-aws-iac-plan
          aws-region: ca-central-1

      - uses: actions/cache@v4
        with:
          path: .plugin-cache
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('live/.terraform.lock.hcl') }}

      # See apply.yml — archive_file zips a directory build.sh creates, so this
      # has to run before any tofu command that evaluates the data source.
      - name: Build Lambda packages
        run: ./numeriseur/build.sh

      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR" && tofu init -input=false

      - name: tofu plan
        id: plan
        run: |
          set +e
          tofu plan -detailed-exitcode -input=false -lock=false -no-color -out=tfplan >plan.log 2>&1
          echo "exitcode=$?" >>"$GITHUB_OUTPUT"

      - name: Build plan comment
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "<!-- tofu-plan -->"
            case "$EXITCODE" in
              0) echo "### ✅ Plan: no changes" ;;
              2)
                destroys=$(tofu show -json tfplan | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')
                if [ "$destroys" -gt 0 ]; then
                  echo "### ⛔ Plan contains **$destroys destroy(s)** — the apply workflow will refuse this on merge"
                  echo
                  tofu show -json tfplan | jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "- `\(.address)`"'
                else
                  echo "### 📝 Plan: changes pending"
                fi
                echo
                grep -E "^Plan:" plan.log || true
                ;;
              *) echo "### 💥 Plan FAILED (exit $EXITCODE)" ;;
            esac
            echo
            echo "<details><summary>Full plan output</summary>"
            echo
            echo '```'
            tail -c 60000 plan.log
            echo '```'
            echo "</details>"
          } >comment.md

      - name: Post sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- tofu-plan -->"))][0].id' 2>/dev/null)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@comment.md >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md >/dev/null
          fi

      - name: Fail job if plan failed
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        run: |
          tail -50 plan.log
          exit 1
